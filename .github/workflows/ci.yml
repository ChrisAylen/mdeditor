name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0

      - name: Install package with dev deps
        run: pip install .[dev]

      - name: Unit tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/unit/ -v

      - name: Integration tests (Linux only)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/integration/ -v
