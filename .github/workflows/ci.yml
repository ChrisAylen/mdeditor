name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0

      - name: Install package
        run: pip install .

      - name: Install test deps
        run: pip install pytest

      - name: Unit tests
        run: python -m pytest tests/unit/ -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0

      - name: Install package with test deps
        run: pip install . pytest pytest-qt

      - name: Integration tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/integration/ -v
